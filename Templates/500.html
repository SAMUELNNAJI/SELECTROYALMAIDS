<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>500 – Server Error | SelectRoyalMaids</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      color: #1e293b;
    }
    .card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 8px 40px rgba(0,0,0,.09);
      padding: 52px 40px 44px;
      max-width: 460px;
      width: 100%;
      text-align: center;
    }
    .icon {
      width: 80px; height: 80px;
      background: linear-gradient(135deg, #dc2626, #ef4444);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 24px;
      font-size: 2rem; color: #fff;
    }
    h1 { font-size: 1.6rem; font-weight: 800; margin-bottom: 10px; }
    p  { color: #64748b; line-height: 1.7; margin-bottom: 28px; font-size: .95rem; }
    a  {
      display: inline-block;
      padding: 13px 28px;
      background: linear-gradient(135deg, #1e3a8a, #2563eb);
      color: #fff; border-radius: 10px;
      font-weight: 700; text-decoration: none;
      font-size: .95rem;
    }
    a:hover { opacity: .88; }
    .brand { font-size: .85rem; color: #94a3b8; margin-top: 24px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">&#9888;</div>
    <h1>Something went wrong</h1>
    <p>
      We hit an unexpected error. Our team has been notified.<br />
      If you just completed a payment, your money is safe — please
      contact us and we will activate your account immediately.
    </p>
    <a href="/">Back to Home</a>
    <p class="brand">SelectRoyalMaids &mdash; Nigeria's most trusted domestic staffing platform</p>
  </div>
</body>
</html>
