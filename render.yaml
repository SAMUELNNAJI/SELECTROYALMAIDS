services:
  # ── Web service ─────────────────────────────────────────────────────────────
  - type: web
    name: selectroyal-maids
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn selectroyal.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: SECRET_KEY
        generateValue: true          # Render auto-generates a secure random value
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"       # extend with your custom domain when ready
      - key: DATABASE_URL
        fromDatabase:
          name: selectroyal-db
          property: connectionString
      - key: FLUTTERWAVE_PUBLIC_KEY
        sync: false                  # fill in manually in the Render dashboard
      - key: FLUTTERWAVE_SECRET_KEY
        sync: false                  # fill in manually in the Render dashboard
      - key: EMAIL_BACKEND
        value: "django.core.mail.backends.smtp.EmailBackend"
      - key: EMAIL_HOST_PASSWORD
        sync: false                  # fill in manually in the Render dashboard
      - key: DEFAULT_FROM_EMAIL
        sync: false                  # must be a verified ZeptoMail sender

  # ── Postgres database ────────────────────────────────────────────────────────
databases:
  - name: selectroyal-db
    databaseName: selectroyal
    user: selectroyal
    plan: free
