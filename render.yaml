services:
  # ── Web service ─────────────────────────────────────────────────────────────
  - type: web
    name: selectroyal-maids
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn selectroyal.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: SECRET_KEY
        generateValue: true          # Render auto-generates a secure random value
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"       # extend with your custom domain when ready
      - key: DATABASE_URL
        fromDatabase:
          name: selectroyal-db
          property: connectionString
      - key: FLUTTERWAVE_PUBLIC_KEY
        sync: false                  # fill in manually in the Render dashboard
      - key: FLUTTERWAVE_SECRET_KEY
        sync: false                  # fill in manually in the Render dashboard
      - key: PAYMENT_CALLBACK_URL
        sync: false                  # e.g. https://your-domain.com (no trailing slash)
      - key: NOTIFICATION_EMAIL
        value: "info@selectroyalmaids.com.ng"   # inbox that receives new placement requests + maid applications
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false                  # fill in manually — required to deliver maid applications via WhatsApp
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false                  # fill in manually
      - key: WHATSAPP_APPLICATION_RECIPIENT
        value: "2349137894958"       # +234 913 789 4958 — maid applications are sent here
      - key: EMAIL_BACKEND
        value: "django.core.mail.backends.smtp.EmailBackend"
      - key: EMAIL_HOST_PASSWORD
        sync: false                  # fill in manually in the Render dashboard
      - key: EMAIL_TIMEOUT
        value: "10"
      - key: DEFAULT_FROM_EMAIL
        sync: false                  # must be a verified ZeptoMail sender

  # ── Postgres database ────────────────────────────────────────────────────────
databases:
  - name: selectroyal-db
    databaseName: selectroyal
    user: selectroyal
    plan: free
