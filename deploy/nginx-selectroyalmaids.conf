# ──────────────────────────────────────────────────────────────────────────────
# SelectRoyal Maids — nginx reverse proxy (AlmaLinux 9)
# Install to /etc/nginx/conf.d/selectroyalmaids.conf and run:
#   sudo nginx -t && sudo systemctl reload nginx
# Then obtain TLS via:  sudo certbot --nginx -d selectroyalmaids.com.ng -d www.selectroyalmaids.com.ng
# ──────────────────────────────────────────────────────────────────────────────

# Redirect all plain HTTP to HTTPS
server {
    listen       80;
    listen       [::]:80;
    server_name  selectroyalmaids.com.ng www.selectroyalmaids.com.ng;

    # Avoid leaking the app PDF/support endpoints on port 80
    location / {
        return 301 https://$host$request_uri;
    }

    # Contingency in case HTTPS is not yet provisioned — comment out after
    # certbot completes.
    # location / {
    #     include uwsgi_params;
    #     proxy_pass http://unix:/run/gunicorn.sock;
    # }
}

server {
    listen       443 ssl http2;
    listen       [::]:443 ssl http2;
    server_name  selectroyalmaids.com.ng www.selectroyalmaids.com.ng;

    # Certbot-managed certificates (paths appear after: certbot --nginx)
    ssl_certificate     /etc/letsencrypt/live/selectroyalmaids.com.ng/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/selectroyalmaids.com.ng/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Larger uploads (maid profile photos / documents)
    client_max_body_size 20m;

    # static/ is collected by `collectstatic` into /srv/selectroyal/staticfiles
    location /static/ {
        alias /srv/selectroyal/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # media/ is Django-uploaded user content (MAID profile photos etc.)
    location /media/ {
        alias /srv/selectroyal/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ── Legacy .php URLs from the old PHP site → new clean URLs ─────────────
    # Pages whose slug CHANGED — exact matches listed first:
    location = /maids.php             { return 301 https://selectroyalmaids.com.ng/Maids/$is_args$args; }
    location = /find-a-maid.php       { return 301 https://selectroyalmaids.com.ng/Maids/$is_args$args; }
    location = /find_maid.php         { return 301 https://selectroyalmaids.com.ng/Maids/$is_args$args; }
    location = /register.php          { return 301 https://selectroyalmaids.com.ng/apply/$is_args$args; }
    location = /maid-registration.php { return 301 https://selectroyalmaids.com.ng/apply/$is_args$args; }
    location = /request_a_maid.php    { return 301 https://selectroyalmaids.com.ng/request-maid/$is_args$args; }
    location = /login.php             { return 301 https://selectroyalmaids.com.ng/login/$is_args$args; }
    location = /signin.php            { return 301 https://selectroyalmaids.com.ng/login/$is_args$args; }
    location = /signup.php            { return 301 https://selectroyalmaids.com.ng/signup/$is_args$args; }
    location = /register-maid.php     { return 301 https://selectroyalmaids.com.ng/apply/$is_args$args; }
    location = /logout.php            { return 301 https://selectroyalmaids.com.ng/$is_args$args; }

    # Generic rule — every other .php URL maps to the same slug with a slash:
    #   /about.php → /about/   /contact.php → /contact/   /services.php → /services/ …
    location ~* ^/([a-z0-9_-]+)\.php$ {
        return 301 https://selectroyalmaids.com.ng/$1/$is_args$args;
    }

    # Everything else goes to gunicorn
    location / {
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;      # SECURE_PROXY_SSL_HEADER
        proxy_set_header X-Forwarded-Host  $host;
        proxy_redirect off;
        proxy_pass http://unix:/run/gunicorn.sock;
        proxy_read_timeout 120;
    }
}